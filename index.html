<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("webCanvas");

const ctx =
    canvas.getContext("2d");


let w = 0;
let h = 0;
let dpr = 1;

let nodes = [];

let mouse = {
    x:0,
    y:0,
    active:false
};


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    dpr =
        Math.min(
            devicePixelRatio || 1,
            2
        );

    w =
        canvas.clientWidth;

    h =
        canvas.clientHeight;


    canvas.width =
        w * dpr;

    canvas.height =
        h * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    const count =
        innerWidth < 600
            ? 42
            : 82;


    nodes =
        Array.from(
            {length:count},
            () => ({

                x:
                    Math.random() * w,

                y:
                    Math.random() * h,

                vx:
                    (Math.random() - .5)
                    * .32,

                vy:
                    (Math.random() - .5)
                    * .32,

                r:
                    .7 +
                    Math.random() * 1.5

            })
        );
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    /* CENTER WEB */

    const cx =
        w / 2;

    const cy =
        h / 2;


    /* WEB RINGS */

    for(
        let ring = 1;
        ring <= 8;
        ring++
    ){

        const radius =
            45 +
            ring * 58;


        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius,
            0,
            Math.PI * 2
        );


        ctx.strokeStyle =
            `rgba(
                37,
                201,
                255,
                ${.08 - ring * .006}
            )`;

        ctx.lineWidth =
            .8;

        ctx.stroke();

    }


    /* WEB SPOKES */

    for(
        let i = 0;
        i < 20;
        i++
    ){

        const angle =
            i *
            Math.PI *
            2 /
            20;


        ctx.beginPath();

        ctx.moveTo(
            cx,
            cy
        );


        ctx.lineTo(
            cx +
            Math.cos(angle) *
            Math.max(w,h),

            cy +
            Math.sin(angle) *
            Math.max(w,h)
        );


        ctx.strokeStyle =
            "rgba(83,103,255,.07)";

        ctx.lineWidth =
            .65;

        ctx.stroke();

    }


    /* =====================================================
       FLOATING NODES
    ===================================================== */

    for(const n of nodes){

        n.x += n.vx;
        n.y += n.vy;


        if(
            n.x < -20 ||
            n.x > w + 20
        ){
            n.vx *= -1;
        }


        if(
            n.y < -20 ||
            n.y > h + 20
        ){
            n.vy *= -1;
        }


        /* MOUSE REPULSION */

        if(mouse.active){

            const dx =
                mouse.x - n.x;

            const dy =
                mouse.y - n.y;

            const dist =
                Math.hypot(
                    dx,
                    dy
                );


            if(
                dist < 170 &&
                dist > 0
            ){

                n.x -=
                    dx /
                    dist *
                    .22;

                n.y -=
                    dy /
                    dist *
                    .22;

            }

        }

    }


    /* =====================================================
       CONNECT NODES
    ===================================================== */

    for(
        let i = 0;
        i < nodes.length;
        i++
    ){

        for(
            let j = i + 1;
            j < nodes.length;
            j++
        ){

            const a =
                nodes[i];

            const b =
                nodes[j];


            const dist =
                Math.hypot(
                    a.x - b.x,
                    a.y - b.y
                );


            if(dist < 140){

                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );


                ctx.strokeStyle =
                    `rgba(
                        37,
                        201,
                        255,
                        ${(1-dist/140)*.34}
                    )`;

                ctx.lineWidth =
                    .7;

                ctx.stroke();

            }

        }

    }


    /* =====================================================
       CURSOR WEB
    ===================================================== */

    if(mouse.active){

        for(const n of nodes){

            const dist =
                Math.hypot(
                    mouse.x - n.x,
                    mouse.y - n.y
                );


            if(dist < 220){

                ctx.beginPath();

                ctx.moveTo(
                    mouse.x,
                    mouse.y
                );

                ctx.lineTo(
                    n.x,
                    n.y
                );


                ctx.strokeStyle =
                    `rgba(
                        37,
                        201,
                        255,
                        ${(1-dist/220)*.68}
                    )`;

                ctx.lineWidth =
                    1;

                ctx.stroke();

            }

        }


        /* CURSOR CIRCLE */

        ctx.beginPath();

        ctx.arc(
            mouse.x,
            mouse.y,
            9,
            0,
            Math.PI * 2
        );


        ctx.strokeStyle =
            "rgba(37,201,255,.85)";

        ctx.lineWidth =
            1.2;

        ctx.stroke();

    }


    /* =====================================================
       NODES
    ===================================================== */

    for(const n of nodes){

        ctx.beginPath();

        ctx.arc(
            n.x,
            n.y,
            n.r,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "rgba(37,201,255,.8)";

        ctx.shadowBlur =
            13;

        ctx.shadowColor =
            "rgba(37,201,255,.75)";


        ctx.fill();

        ctx.shadowBlur =
            0;

    }


    requestAnimationFrame(draw);
}


/* =========================================================
   POINTER
========================================================= */

function pointer(x,y){

    const rect =
        canvas.getBoundingClientRect();


    mouse.x =
        x - rect.left;

    mouse.y =
        y - rect.top;

    mouse.active =
        true;
}


/* =========================================================
   RESIZE EVENT
========================================================= */

addEventListener(
    "resize",
    resize
);


/* =========================================================
   MOUSE MOVE
========================================================= */

addEventListener(
    "pointermove",
    e => {

        pointer(
            e.clientX,
            e.clientY
        );

    },
    {
        passive:true
    }
);


/* =========================================================
   TOUCH / CLICK
========================================================= */

addEventListener(
    "pointerdown",
    e => {

        pointer(
            e.clientX,
            e.clientY
        );


        const ripple =
            document.createElement("span");


        ripple.className =
            "touch-ripple";


        ripple.style.left =
            e.clientX + "px";


        ripple.style.top =
            e.clientY + "px";


        document.body.appendChild(
            ripple
        );


        setTimeout(
            () => ripple.remove(),
            800
        );

    },
    {
        passive:true
    }
);


/* =========================================================
   POINTER LEAVE
========================================================= */

addEventListener(
    "pointerleave",
    () => {

        mouse.active =
            false;

    },
    {
        passive:true
    }
);


/* =========================================================
   TOUCH END
========================================================= */

addEventListener(
    "touchend",
    () => {

        mouse.active =
            false;

    }
);


/* =========================================================
   START
========================================================= */

resize();

requestAnimationFrame(
    draw
);


/* =========================================================
   NAVIGATION
========================================================= */

function goToHome(){

    window.location.href =
        "home.html";

}

</script>
